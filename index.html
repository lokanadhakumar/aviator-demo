<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aviator Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:#0b0f1a;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow:hidden;
}
#game {
  width:100%;
  height:100vh;
  text-align:center;
  position:relative;
}
#plane {
  position:absolute;
  left:10%;
  bottom:20%;
  width:90px;
  transition: transform 0.08s linear;
}
#multiplier {
  font-size:56px;
  margin-top:30px;
}
.controls {
  margin-top:20px;
}
button {
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
#start { background:#00d084; }
#cash { background:#ff5252; }
#status { margin-top:10px; opacity:0.9; }
</style>
</head>

<body>

<div id="game">
  <h2 id="playerName"></h2>
  <div id="multiplier">1.00x</div>

  <img id="plane" src="https://i.imgur.com/6XH6QkL.png">

  <div class="controls">
    <button id="start">Start</button>
    <button id="cash">Cash Out</button>
  </div>

  <p id="status"></p>
</div>

<script>
/* ===============================
   PLAYER NAME
================================*/
let playerName = localStorage.getItem("playerName");
if (!playerName) {
  playerName = prompt("Enter your name:");
  localStorage.setItem("playerName", playerName);
}
document.getElementById("playerName").innerText = "Player: " + playerName;

/* ===============================
   GAME STATE
================================*/
let multiplier = 1;
let crashPoint = 0;
let running = false;
let interval = null;

/* ===============================
   RANDOM CRASH LOGIC
================================*/
function getCrashPoint() {
  const r = Math.random();
  if (r < 0.04) return rand(50, 1000);
  if (r < 0.15) return rand(10, 50);
  if (r < 0.40) return rand(2, 10);
  return rand(1.05, 2);
}
function rand(min, max) {
  return +(Math.random() * (max - min) + min).toFixed(2);
}

/* ===============================
   GAME LOOP
================================*/
function startGame() {
  if (running) return;
  running = true;
  multiplier = 1;
  crashPoint = getCrashPoint();
  document.getElementById("status").innerText = "Flying...";
  runLoop();
}

function runLoop() {
  interval = setInterval(() => {
    multiplier += multiplier * 0.018;
    document.getElementById("multiplier").innerText =
      multiplier.toFixed(2) + "x";

    document.getElementById("plane").style.transform =
      `translateX(${multiplier * 6}px) rotate(${multiplier * 2}deg)`;

    if (multiplier >= crashPoint) crash();
  }, 60);
}

function crash() {
  clearInterval(interval);
  document.getElementById("status").innerText =
    "💥 Crashed at " + multiplier.toFixed(2) + "x";
  running = false;
}

function cashOut() {
  if (!running) return;
  document.getElementById("status").innerText =
    "Cashed out at " + multiplier.toFixed(2) + "x";
}

/* ===============================
   BUTTONS
================================*/
document.getElementById("start").onclick = startGame;
document.getElementById("cash").onclick = cashOut;
</script>

</body>
</html>
