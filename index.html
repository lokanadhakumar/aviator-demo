<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aviator Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0; background:#0b0f1a; color:#fff; font-family:Arial;
}
#game { max-width:900px; margin:auto; padding:20px; }
#plane {
  position:absolute;
  left:10%;
  bottom:20%;
  width:80px;
  transition: transform 0.1s linear;
}
#multiplier {
  font-size:64px;
  font-weight:bold;
  margin:20px 0;
}
button {
  padding:10px 20px;
  background:#ff5252;
  border:none;
  color:white;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
}
input { padding:8px; width:80px; }
#log { font-size:14px; opacity:0.8; }
</style>
</head>

<body>

<div id="game">
  <h2 id="welcome"></h2>
  <div id="multiplier">1.00x</div>

  <div>
    Bet: <input id="bet" type="number" value="10">
    <button onclick="startGame()">Start</button>
    <button onclick="cashOut()">Cash Out</button>
  </div>

  <p id="status"></p>

  <img id="plane" src="https://i.imgur.com/7fZ4F2C.png">
</div>

<script>
let balance = 1000;
let running = false;
let crashed = false;
let multiplier = 1;
let crashPoint = 0;
let interval;

// PLAYER NAME
let name = localStorage.getItem("player_name");
if (!name) {
  name = prompt("Enter your name:");
  localStorage.setItem("player_name", name);
}
document.getElementById("welcome").innerText = "Welcome, " + name;

// RANDOM CRASH GENERATOR
function generateCrash() {
  let r = Math.random();
  if (r < 0.04) return random(50, 1000);
  if (r < 0.15) return random(10, 50);
  if (r < 0.4) return random(2, 10);
  return random(1.01, 2);
}

function random(min, max) {
  return +(Math.random() * (max - min) + min).toFixed(2);
}

// START GAME
function startGame() {
  if (running) return;
  running = true;
  crashed = false;
  multiplier = 1;
  crashPoint = generateCrash();

  document.getElementById("status").innerText = "Flying...";
  animate();
}

function animate() {
  interval = setInterval(() => {
    multiplier += multiplier * 0.02;
    document.getElementById("multiplier").innerText = multiplier.toFixed(2) + "x";

    document.getElementById("plane").style.transform =
      `translateX(${multiplier * 5}px) rotate(${multiplier * 2}deg)`;

    if (multiplier >= crashPoint) {
      crash();
    }
  }, 60);
}

function cashOut() {
  if (!running) return;
  document.getElementById("status").innerText =
    "Cashed out at " + multiplier.toFixed(2) + "x";
}

function crash() {
  clearInterval(interval);
  running = false;
  document.getElementById("status").innerText =
    "💥 Crashed at " + multiplier.toFixed(2) + "x";
}

</script>

</body>
</html>
